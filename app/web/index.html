<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#16181b">
  <title>Course Assistant</title>
  <meta name="description" content="Ask about a course. Answers come only from the course documents.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%232a2e34'/%3E%3Cpath d='M16 11c-2-1.6-4.5-2-7-2v13c2.5 0 5 .4 7 2 2-1.6 4.5-2 7-2V9c-2.5 0-5 .4-7 2zm0 0v13' fill='none' stroke='%235ec7b7' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/web/styles.css">
  <script src="/web/app.js" defer></script>
</head>
<body>
  <div class="app">

    <header class="topbar">
      <div class="brand">
        <span class="avatar" aria-hidden="true">
          <svg viewBox="0 0 20 20"><path d="M10 5.5C8.5 4.300 6.5 4 4 4v10.5c2.5 0 4.5.3 6 1.5 1.5-1.200 3.5-1.5 6-1.5V4c-2.5 0-4.5.3-6 1.5zm0 0V16"/></svg>
        </span>
        <div class="brand-text">
          <h1 class="brand-name">Course Assistant</h1>
          <p class="service" id="service" data-state="checking">
            <span class="service-dot" aria-hidden="true"></span>
            <span role="status"><span id="service-label">Checking</span><span class="service-more" id="service-more"></span></span>
            <span class="service-detail" id="service-detail"></span>
          </p>
        </div>
      </div>

      <div class="actions">
        <button class="new-chat" id="new-chat" type="button">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>
          <span class="new-chat-text">New chat</span>
        </button>
        <label class="switch">
          <input type="checkbox" role="switch" id="presenter">
          <span class="switch-track" aria-hidden="true"></span>
          <span class="switch-text">Presenter<span class="switch-more"> view</span></span>
        </label>
      </div>
    </header>

    <main class="main">
      <div class="scroller" id="scroller" tabindex="0" role="region" aria-label="Conversation">
        <div class="column">
          <section class="welcome" id="welcome" aria-labelledby="welcome-title">
            <div class="greeting">
              <span class="avatar avatar-large" aria-hidden="true">
                <svg viewBox="0 0 20 20"><path d="M10 5.5C8.5 4.300 6.5 4 4 4v10.5c2.5 0 4.5.3 6 1.5 1.5-1.200 3.5-1.5 6-1.5V4c-2.5 0-4.5.3-6 1.5zm0 0V16"/></svg>
              </span>
              <h2 class="greeting-title" id="welcome-title">How can I help with your courses?</h2>
              <p class="greeting-text">Ask about length, price, instructor, requirements or what you will learn.</p>
            </div>
            <ul class="chips" id="starters">
              <li><button type="button" class="chip">How long is the Python course?</button></li>
              <li><button type="button" class="chip">What courses do you have?</button></li>
              <li><button type="button" class="chip">How long is the Java course?</button></li>
              <li><button type="button" class="chip">Compare the price of the Java and Python courses</button></li>
              <li><button type="button" class="chip">Does the Java course include a free laptop?</button></li>
            </ul>
          </section>

          <div class="log" id="log" role="log" aria-live="polite" aria-relevant="additions" aria-label="Questions and answers"></div>
        </div>
      </div>

      <div class="dock">
        <button class="jump" id="jump" type="button" hidden>Go to the latest reply</button>

        <form class="composer" id="composer" novalidate>
          <label class="visually-hidden" for="input">Your question</label>
          <textarea id="input" rows="1" maxlength="500" placeholder="Ask about a course" autocomplete="off" aria-describedby="hint counter"></textarea>
          <button class="send" id="send" type="submit" aria-label="Send" disabled>
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 16V4M5 9l5-5 5 5"/></svg>
          </button>
        </form>

        <div class="composer-meta">
          <span id="hint">Answers come from the course documents</span>
          <span class="counter" id="counter" hidden></span>
        </div>
      </div>
    </main>
  </div>

  <div class="visually-hidden" id="announcer" role="status" aria-live="polite"></div>
</body>
</html>
